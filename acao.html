<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://ypdvpytpajgkzglbzxwg.supabase.co; base-uri 'none'; form-action 'none'">
<title>traduzme · pedido</title>
<style>
  :root{--ink:#13233a;--soft:#2d4260;--grey:#6a7384;--brand:#1a7a5e;--paper:#f4f2ec;--card:#fff;--line:#e7e3d9;--warn:#b4442f}
  @media (prefers-color-scheme:dark){:root{--ink:#eef1f5;--soft:#c9d2de;--grey:#9aa4b2;--brand:#4fc39c;--paper:#10161f;--card:#18212d;--line:#2a3442;--warn:#ff8a73}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;padding:16px}
  .box{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;text-align:center}
  .logo{font-weight:800;font-size:20px;letter-spacing:-.02em;margin-bottom:18px}
  h1{font-size:21px;margin:0 0 8px}
  p{font-size:15px;line-height:1.55;color:var(--soft);margin:0 0 18px}
  button{width:100%;border:0;border-radius:10px;background:var(--brand);color:#fff;font-size:17px;font-weight:700;padding:15px 18px;cursor:pointer}
  button[disabled]{opacity:.6;cursor:default}
  .ok{color:var(--brand);font-weight:700}
  .erro{color:var(--warn)}
  .pq{font-size:13px;color:var(--grey);margin-top:16px}.box.larga .pq{text-align:center}
  .box.larga{max-width:520px;text-align:left}.box.larga .logo,.box.larga h1{text-align:center}.box.larga p{text-align:center}
  #up{display:none}
  .drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:22px 14px;text-align:center;color:var(--soft);font-size:15px;cursor:pointer;margin:0 0 14px}
  .drop.on{border-color:var(--brand);background:rgba(26,122,94,.07)}
  .drop b{color:var(--brand)}
  .drop input{display:none}
  #lista{list-style:none;margin:0 0 14px;padding:0}
  #lista li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;font-size:14px}
  #lista .n{flex:1;word-break:break-all;color:var(--ink)}
  #lista .s{font-size:12px;color:var(--grey);white-space:nowrap}
  #lista .st{font-size:13px;white-space:nowrap}
  #lista .st.ok{color:var(--brand)}#lista .st.er{color:var(--warn)}
  #lista button.x{width:auto;background:none;color:var(--grey);font-size:18px;padding:0 4px;font-weight:400}
  .nota{font-size:13px;color:var(--grey);text-align:center;margin:12px 0 0}
  .msg{font-size:14px;text-align:center;margin:0 0 12px;min-height:1em}
</style>
</head>
<body>
<main class="box">
  <div class="logo">traduzme</div>
  <h1 id="t">Pedido</h1>
  <p id="m">Carregando…</p>
  <div id="up">
    <label class="drop" id="drop"><b>Escolher PDF(s)</b><br><span style="font-size:13px">ou arraste os arquivos para cá · até 15 MB cada</span><input id="f" type="file" accept="application/pdf,.pdf" multiple></label>
    <ul id="lista"></ul>
    <div class="msg erro" id="msg"></div>
    <button id="env" type="button" disabled>Enviar ao cliente</button>
    <div class="nota" id="nota"></div>
  </div>
  <button id="b" type="button" hidden></button>
  <div class="pq" id="pq"></div>
</main>
<script>
(function(){
  var FN="https://ypdvpytpajgkzglbzxwg.supabase.co/functions/v1/tradutora-acao";
  var q=new URLSearchParams(location.search), P=q.get("p")||"", A=q.get("a")||"", K=q.get("k")||"", E=q.get("e")||"";
  /* v4 (11.11.2026): Cartório (e-Apostila) – a=c_recebido | c_entregar, e=orig|trad, Funktion cartorio */
  var FC="https://ypdvpytpajgkzglbzxwg.supabase.co/functions/v1/cartorio", CART=A==="c_recebido"||A==="c_entregar"||A==="c_papel"||A==="c_rastreio";
  /* v5 (24.11.2026): Papier-Original – a=c_papel (Chegou je Dokument / Problema), a=c_rastreio (Rastreio der Ruecksendung), e=papel */
  var t=document.getElementById("t"), m=document.getElementById("m"), b=document.getElementById("b"), pq=document.getElementById("pq");
  var TXT={recebido:{t:"Recebimento",ok:"Registrado, obrigado!",wait:"Registrando…"},
           entregue:{t:"Entrega",ok:"Registrado, obrigado! O pagamento sai via Pix no dia da entrega.",wait:"Registrando…"},
           c_recebido:{t:"Recebimento (e-Apostila)",ok:"Registrado, obrigado! Quando a apostila estiver pronta, clique em Entregar apostila no e-mail.",wait:"Registrando…"},
           c_entregar:{t:"Entrega da apostila"}, c_papel:{t:"Original em papel"}, c_rastreio:{t:"Devolução ao cliente"}};
  function dataHora(iso){ try{ return new Date(iso).toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }catch(e){ return iso; } }
  function erro(x){ t.textContent="Link inválido"; m.innerHTML=""; m.className="erro"; m.textContent=x||"Este link não funciona. Responda o e-mail do pedido, por favor."; b.hidden=true; }
  function chamar(extra){ return fetch(FN,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.assign({p:P,a:A,k:K},extra||{}))}).then(function(r){ return r.json().catch(function(){ return {ok:false}; }); }); }
  function mostrar(r){
    var T=TXT[A]; pq.textContent="Pedido #"+(r.pedido||"");
    var feito=A==="recebido"||A==="c_recebido"?r.recebido_em:r.entregue_em;
    t.innerHTML='<span class="ok">\u2713</span> '+T.t; m.className="ok"; m.textContent=T.ok+(feito?" ("+dataHora(feito)+")":""); b.hidden=true;
  }
  if(!TXT[A]||!/^[0-9a-f]{20,64}$/i.test(P)||!/^[0-9a-f]{32}$/i.test(K)||(CART&&!/^(orig|trad|papel)$/.test(E))||((A==="c_papel"||A==="c_rastreio")&&E!=="papel")){ erro(); return; }
  if(A==="entregue"||A==="c_entregar"){ entrega(); return; }
  if(A==="c_recebido"){ t.textContent=TXT[A].t; m.textContent=TXT[A].wait;
    fetch(FC,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({p:P,e:E,k:K,fase:"recebido"})}).then(function(r){ return r.json(); }).then(function(r){ if(!r||!r.ok) return erro(); mostrar(r); }).catch(function(){ erro("Sem conexão. Abra o link de novo em instantes."); });
    return; }
  if(A==="c_papel"||A==="c_rastreio"){ papelPag(); return; }
  /* v2 (18.10.2026): der Klick in der Mail speichert direkt, kein zweiter Knopf */
  t.textContent=TXT[A].t; m.textContent=TXT[A].wait;
  chamar({auto:true}).then(function(r){ if(!r||!r.ok) return erro(); mostrar(r); }).catch(function(){ erro("Sem conexão. Abra o link de novo em instantes."); });

  /* v5: Papier-Original (Chegou je Dokument, Problema) und Rastreio der Ruecksendung */
  function papelPag(){
    var box=document.querySelector(".box"), alvo=document.createElement("div"); box.classList.add("larga"); box.insertBefore(alvo,pq);
    function cf(extra){ return fetch(FC,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.assign({p:P,e:"papel",k:K},extra))}).then(function(r){ return r.json().catch(function(){ return {ok:false,erro:"resposta"}; }); }); }
    function el(tag,txt,css){ var x=document.createElement(tag); if(txt!=null) x.textContent=txt; if(css) x.style.cssText=css; return x; }
    var aviso=el("div","","font-size:14px;text-align:center;margin:10px 0;min-height:1em");
    function render(r){
      pq.textContent="Pedido #"+(r.pedido||"")+(r.teste?" · TESTE":""); alvo.innerHTML=""; t.textContent=TXT[A].t; m.className="";
      if(A==="c_rastreio"){
        if(r.rastreio&&r.rastreio.codigo){ t.innerHTML='<span class="ok">\u2713</span> Rastreio registrado'; m.className="ok"; m.textContent="Código "+r.rastreio.codigo+" ("+dataHora(r.rastreio.em)+"). O cliente recebeu o código por e-mail. Obrigado!"; return; }
        if(!r.devolver_em){ m.textContent="A devolução ainda não foi liberada. Você recebe um e-mail quando o cliente tiver recebido tudo."; return; }
        m.textContent="Quando receber da traduzme o e-mail com a etiqueta paga, cole no envelope (original apostilado + tradução impressa), poste nos Correios e escreva aqui o código de rastreio.";
        var inp=el("input",null,"width:100%;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:10px;margin:0 0 12px;text-transform:uppercase;background:var(--card);color:var(--ink)"); inp.placeholder="Ex.: AB123456789BR"; inp.autocomplete="off";
        var bt=el("button","Enviar código ao cliente");
        bt.onclick=function(){ var c=inp.value.replace(/[\s.-]/g,"").toUpperCase(); if(!/^[A-Z0-9]{8,30}$/.test(c)){ aviso.className="erro"; aviso.textContent="Código inválido. Confira e tente de novo."; return; }
          if(!window.confirm("Enviar o código "+c+" ao cliente?")) return; bt.disabled=true; aviso.textContent="";
          cf({fase:"rastreio",codigo:c}).then(function(x){ bt.disabled=false; if(x&&x.ok) return render(x); aviso.className="erro"; aviso.textContent=x&&x.erro==="codigo"?"Código inválido.":"Não deu certo. Tente de novo em instantes."; }).catch(function(){ bt.disabled=false; aviso.className="erro"; aviso.textContent="Sem conexão."; }); };
        alvo.appendChild(inp); alvo.appendChild(bt); alvo.appendChild(aviso); return;
      }
      /* c_papel */
      var docs=r.docs||[], falta=docs.filter(function(d){ return !d.chegou; });
      m.textContent=r.recebido_em?"Todos os originais chegaram ("+dataHora(r.recebido_em)+"). Agora apostile e clique em Entregar apostila no e-mail.":"Marque cada documento que chegou pelo correio e clique em Confirmar. Se algo estiver diferente, use Problema.";
      if(r.recebido_em) m.className="ok";
      var ul=el("div","","margin:0 0 14px"), marcas=[];
      docs.forEach(function(d){ var lb=el("label","","display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 8px;font-size:15px;cursor:pointer");
        var cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!d.chegou; cb.disabled=!!d.chegou; cb.style.cssText="width:20px;height:20px"; if(!d.chegou) marcas.push({cb:cb,i:d.i});
        lb.appendChild(cb); lb.appendChild(el("span",d.nome,"flex:1")); lb.appendChild(el("span",d.chegou?"\u2713 chegou "+dataHora(d.chegou):"",d.chegou?"font-size:12px;color:var(--brand)":"")); ul.appendChild(lb); });
      alvo.appendChild(ul);
      if(falta.length){ var bc=el("button","Confirmar chegada"); bc.onclick=function(){ var sel=marcas.filter(function(x){ return x.cb.checked; }).map(function(x){ return x.i; }); if(!sel.length){ aviso.className="erro"; aviso.textContent="Marque pelo menos um documento."; return; }
          bc.disabled=true; aviso.textContent=""; cf({fase:"chegou",docs:sel}).then(function(x){ bc.disabled=false; if(x&&x.ok){ render(x); aviso.className="ok"; aviso.textContent=x.completo?"Obrigado! Cliente e tradutora foram avisados.":"Registrado. Ainda falta pelo menos um documento."; alvo.appendChild(aviso); return; } aviso.className="erro"; aviso.textContent="Não deu certo. Tente de novo."; }).catch(function(){ bc.disabled=false; aviso.className="erro"; aviso.textContent="Sem conexão."; }); };
        alvo.appendChild(bc); }
      alvo.appendChild(aviso);
      alvo.appendChild(el("div","Problema?","font-weight:700;margin:22px 0 6px;font-size:15px"));
      var ta=document.createElement("textarea"); ta.rows=3; ta.maxLength=1500; ta.placeholder="Ex.: chegou outro documento, ilegível, sem firma reconhecida…"; ta.style.cssText="width:100%;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:10px;margin:0 0 10px;background:var(--card);color:var(--ink);font-family:inherit";
      var bp=el("button","Enviar problema à traduzme","background:var(--card);color:var(--warn);border:2px solid var(--warn)");
      bp.onclick=function(){ var tx=ta.value.trim(); if(tx.length<3) return; bp.disabled=true; cf({fase:"problema",texto:tx}).then(function(x){ bp.disabled=false; if(x&&x.ok){ ta.value=""; render(x); aviso.className="ok"; aviso.textContent="Enviado. A traduzme entra em contato."; alvo.appendChild(aviso); return; } aviso.className="erro"; aviso.textContent="Não deu certo. Tente de novo."; }).catch(function(){ bp.disabled=false; aviso.className="erro"; aviso.textContent="Sem conexão."; }); };
      alvo.appendChild(ta); alvo.appendChild(bp);
      (r.problemas||[]).forEach(function(x){ alvo.appendChild(el("div",dataHora(x.em)+": "+x.texto,"font-size:13px;color:var(--grey);margin:8px 0 0")); });
    }
    t.textContent=TXT[A].t; m.textContent="Carregando…";
    cf({fase:"estado"}).then(function(r){ if(!r||!r.ok) return erro(); render(r); }).catch(function(){ erro("Sem conexão. Abra o link de novo em instantes."); });
  }

  /* v3 (18.10.2026): "Entregue" = PDFs hochladen, die Funktion tradutora-entrega mailt sie vom traduzme an den Kunden */
  function entrega(){
    var FE=CART?FC:"https://ypdvpytpajgkzglbzxwg.supabase.co/functions/v1/tradutora-entrega", VIA=false;
    var up=document.getElementById("up"), drop=document.getElementById("drop"), inp=document.getElementById("f"), lista=document.getElementById("lista"), msg=document.getElementById("msg"), env=document.getElementById("env"), nota=document.getElementById("nota");
    var box=document.querySelector(".box"), itens=[], ocupado=0, MAX=15*1048576, enviando=false;
    var TIT=CART?"Entrega da apostila":"Entrega da tradução";
    t.textContent=TIT; m.textContent="Carregando…";
    function ch(extra){ return fetch(FE,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.assign(CART?{p:P,k:K,e:E}:{p:P,k:K},extra))}).then(function(r){ return r.json().catch(function(){ return {ok:false,erro:"resposta"}; }); }); }
    function mb(b){ return b>=1048576?(b/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(b/1024))+" KB"; }
    function feito(r){
      up.style.display="none"; t.innerHTML='<span class="ok">\u2713</span> Entrega enviada'; m.className="ok";
      m.textContent=(CART?"Apostila recebida pela traduzme. Obrigado! O pagamento sai via Pix.":r.cartorio?"A tradução foi para o cartório para a apostila. O cliente recebe tudo junto assim que a apostila ficar pronta. Obrigado! O pagamento sai via Pix no dia da entrega.":"O cliente recebeu a tradução por e-mail do traduzme. Obrigado! O pagamento sai via Pix no dia da entrega.")+(r.entregue_em?" ("+dataHora(r.entregue_em)+")":""); pq.textContent="Pedido #"+(r.pedido||"");
    }
    function pintar(){
      lista.innerHTML="";
      itens.forEach(function(it){
        var li=document.createElement("li"), n=document.createElement("span"), s=document.createElement("span"), st=document.createElement("span"), x=document.createElement("button");
        n.className="n"; n.textContent=it.nome; s.className="s"; s.textContent=mb(it.bytes);
        st.className="st "+(it.estado==="ok"?"ok":it.estado==="erro"?"er":""); st.textContent=it.estado==="ok"?"\u2713 pronto":it.estado==="erro"?(it.msg||"erro"):"enviando…";
        x.type="button"; x.className="x"; x.textContent="\u00d7"; x.title="Remover"; x.disabled=enviando; x.onclick=function(){ remover(it); };
        li.appendChild(n); li.appendChild(s); li.appendChild(st); li.appendChild(x); lista.appendChild(li);
      });
      var prontos=itens.filter(function(i){ return i.estado==="ok"; }).length;
      env.disabled=enviando||ocupado>0||prontos===0;
      var DEST=CART?"à traduzme":VIA?"ao cartório":"ao cliente";
      env.textContent=prontos>1?"Enviar "+prontos+" arquivos "+DEST:"Enviar "+DEST;
    }
    function remover(it){
      itens=itens.filter(function(i){ return i!==it; }); pintar();
      if(it.estado==="ok") ch({fase:"remover",nome:it.nome}).catch(function(){});
    }
    var ERR={pdf:"não é um PDF",nome:"nome inválido",grande:"maior que 15 MB",qtd:"máx. 15 arquivos",total:"arquivos grandes demais",storage:"falhou, tente de novo",db:"falhou, tente de novo",ja:"já enviado"};
    function subir(file){
      var it={nome:file.name,bytes:file.size,estado:"subindo"}; 
      itens=itens.filter(function(i){ return i.nome!==it.nome; }); itens.push(it);
      if(!/\.pdf$/i.test(file.name)){ it.estado="erro"; it.msg="só PDF"; pintar(); return; }
      if(file.size>MAX){ it.estado="erro"; it.msg="maior que 15 MB"; pintar(); return; }
      ocupado++; pintar();
      var fr=new FileReader();
      fr.onerror=function(){ ocupado--; it.estado="erro"; it.msg="não consegui ler"; pintar(); };
      fr.onload=function(){
        var d=String(fr.result||""), i=d.indexOf(","); d=i>=0?d.slice(i+1):d;
        ch({fase:"subir",nome:file.name,dados:d}).then(function(r){
          ocupado--;
          if(r&&r.ok&&r.ja){ feito(r); return; }
          if(r&&r.ok){ it.estado="ok"; } else { it.estado="erro"; it.msg=ERR[r&&r.erro]||"falhou, tente de novo"; }
          pintar();
        }).catch(function(){ ocupado--; it.estado="erro"; it.msg="sem conexão"; pintar(); });
      };
      fr.readAsDataURL(file);
    }
    function receber(files){ msg.textContent=""; Array.prototype.forEach.call(files,subir); inp.value=""; }
    inp.onchange=function(){ receber(inp.files); };
    ["dragenter","dragover"].forEach(function(e){ drop.addEventListener(e,function(ev){ ev.preventDefault(); drop.classList.add("on"); }); });
    ["dragleave","drop"].forEach(function(e){ drop.addEventListener(e,function(ev){ ev.preventDefault(); drop.classList.remove("on"); }); });
    drop.addEventListener("drop",function(ev){ if(ev.dataTransfer&&ev.dataTransfer.files) receber(ev.dataTransfer.files); });
    env.onclick=function(){
      var prontos=itens.filter(function(i){ return i.estado==="ok"; }).length;
      if(!prontos||enviando) return;
      if(!window.confirm("Enviar "+(prontos>1?prontos+" arquivos":"1 arquivo")+" agora "+(CART?"para a traduzme":VIA?"para o cartório (apostila)":"para o cliente")+"?\nNão dá para desfazer.")) return;
      enviando=true; msg.textContent=""; env.textContent="Enviando…"; pintar();
      ch({fase:"enviar"}).then(function(r){
        enviando=false;
        if(r&&r.ok){ feito(r); return; }
        var e=r&&r.erro; msg.textContent=e==="mail"?"Não consegui enviar o e-mail ao cliente. Seus arquivos estão salvos: clique em Enviar de novo em alguns instantes. Se continuar, avise o Ben.":e==="ocupado"?"O envio já está em andamento. Aguarde um minuto.":e==="sem_email"?"Falta o e-mail do cliente. Avise o Ben.":e==="nao_chegou"?"Primeiro clique em Chegou / Problema no e-mail e confirme a chegada de todos os originais em papel.":e==="aguarda_original"?"Aguarde o original apostilado: ele chega por e-mail. Traduza também a apostila e envie depois.":"Não deu certo. Tente de novo ou avise o Ben.";
        pintar();
      }).catch(function(){ enviando=false; msg.textContent="Sem conexão. Seus arquivos estão salvos: clique em Enviar de novo."; pintar(); });
    };
    ch({fase:"estado"}).then(function(r){
      if(!r||!r.ok) return erro();
      pq.textContent="Pedido #"+(r.pedido||"");
      if(r.enviado){ feito(r); return; }
      VIA=!CART&&!!r.cartorio;
      box.classList.add("larga"); t.textContent=TIT;
      m.className=""; m.textContent=CART?"Anexe o PDF apostilado (e-Apostila). Ao clicar em Enviar, o arquivo chega direto à traduzme, que cuida do resto.":VIA?"Anexe a tradução assinada (PDF). Este pedido tem apostila na tradução: ao clicar em Enviar, a tradução vai primeiro ao cartório, e o cliente recebe tudo junto assim que a apostila ficar pronta.":"Anexe a tradução assinada (PDF). Ao clicar em Enviar, o cliente recebe os arquivos por e-mail do traduzme e o pedido fica registrado como entregue.";
      if(CART&&E==="papel"&&!r.recebido_em) m.textContent="Antes de enviar, clique em Chegou / Problema (no e-mail) e confirme a chegada de todos os originais em papel. Depois anexe o PDF do original apostilado.";
      if(!CART&&r.aguarda_orig) m.textContent+=" Atenção: o original apostilado ainda não chegou. Ele vem por e-mail; traduza também a apostila antes de enviar.";
      nota.textContent=CART?(r.teste?"TESTE":""):VIA?"":(r.para?"O e-mail vai para "+r.para+".":"");
      itens=(r.arquivos||[]).map(function(a){ return {nome:a.nome,bytes:a.bytes,estado:"ok"}; });
      up.style.display="block"; pintar();
    }).catch(function(){ erro("Sem conexão. Abra o link de novo em instantes."); });
  }
})();
</script>
</body>
</html>
